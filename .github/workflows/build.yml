name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - run: gradle build
        working-directory: KoyaRobberyForge-1.20.1-source
      - uses: actions/upload-artifact@v4
        with:
          name: koyarobbery-jar
          path: KoyaRobberyForge-1.20.1-source/build/libs/*.jar
